ODROIDN2L-UBOOT-CONFIG

setenv bootlabel "Yocto"

setenv board "odroidn2l"
setenv display_autodetect "true"

setenv dtb_loadaddr "0x10000000"
setenv dtbo_addr_r "0x11000000"
setenv k_addr "0x1100000"
setenv loadaddr "0x8000000"
setenv initrd_loadaddr "0x3700000"

setenv condev "console=ttyAML0,115200n8"

setenv bootargs "root=/dev/mmcblk1p3 rootwait rw no_console_suspend ${condev} cma=512M"

load mmc ${devno}:1 ${k_addr} Image.gz
load mmc ${devno}:1 ${dtb_loadaddr} amlogic/meson64_odroidn2l.dtb
fdt addr ${dtb_loadaddr}

unzip ${k_addr} ${loadaddr}

booti ${loadaddr} - ${dtb_loadaddr}
